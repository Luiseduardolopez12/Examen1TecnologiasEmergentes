<main class="pagina">
  <form class="tarjeta" (submit)="entrar($event)">
    <h1>Analítica de Ventas</h1>
    <p class="sub">Inicia sesión para ver el dashboard.</p>

    <label for="usuario">Usuario</label>
    <input id="usuario" type="text" autocomplete="username" [value]="usuario()"
           (input)="usuario.set($any($event.target).value)" />

    <label for="clave">Clave</label>
    <input id="clave" type="password" autocomplete="current-password" [value]="clave()"
           (input)="clave.set($any($event.target).value)" />

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="entrando()">{{ entrando() ? 'Entrando…' : 'Entrar' }}</button>
  </form>
</main>
