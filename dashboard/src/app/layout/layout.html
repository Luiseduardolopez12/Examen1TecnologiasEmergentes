<header class="barra">
  <div class="marca">
    <strong>Analítica de Ventas</strong>
    <span class="sub">WideWorldImporters · Data Warehouse</span>
  </div>
  <nav>
    <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Resumen</a>
    <a routerLink="/asistente" routerLinkActive="activo">Asistente</a>
    <a routerLink="/etl" routerLinkActive="activo">Monitoreo ETL</a>
  </nav>
  <div class="estado">
    @if (actualizacion(); as a) {
      <span>Datos hasta <strong>{{ fecha(a.datos_hasta) }}</strong></span>
      <span>Última carga: <strong>{{ fecha(a.ultima_carga, true) }}</strong></span>
    }
    <button type="button" (click)="salir()">Salir</button>
  </div>
</header>
<router-outlet />
